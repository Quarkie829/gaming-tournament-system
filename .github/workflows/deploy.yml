name: CI/CD & Deploy to GitHub Pages

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # ----------------------------------------------------
  # 1. Backend Verification & Tests
  # ----------------------------------------------------
  backend-test-and-build:
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: Priyanshu123@
          MYSQL_DATABASE: gaming_tournament_db
        ports:
          - 3306:3306
        options: --health-cmd="mysqladmin ping" --health-interval=10s --health-timeout=5s --health-retries=5

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Initialize MySQL Database (Schema, Triggers, Seed)
        env:
          MYSQL_PWD: Priyanshu123@
        run: |
          mysql -h 127.0.0.1 -P 3306 -u root gaming_tournament_db < database/01_schema.sql
          mysql -h 127.0.0.1 -P 3306 -u root gaming_tournament_db < database/02_triggers.sql
          mysql -h 127.0.0.1 -P 3306 -u root gaming_tournament_db < database/03_seed.sql

      - name: Install Backend Dependencies
        working-directory: backend
        run: npm ci

      - name: Run Backend Integration Test Suites (Modules 1–6)
        working-directory: backend
        env:
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_USER: root
          DB_PASSWORD: Priyanshu123@
          DB_NAME: gaming_tournament_db
          JWT_SECRET: ci_test_jwt_secret_token_key_123456789
          PORT: 5000
        run: npm test

      - name: Build Backend TypeScript
        working-directory: backend
        run: npm run build

  # ----------------------------------------------------
  # 2. Frontend Build & Deploy to GitHub Pages
  # ----------------------------------------------------
  frontend-build-and-deploy:
    runs-on: ubuntu-latest
    needs: backend-test-and-build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend Dependencies
        working-directory: frontend
        run: npm ci

      - name: Build Frontend with Vite
        working-directory: frontend
        env:
          VITE_BASE_PATH: './'
          VITE_API_URL: ${{ vars.VITE_API_URL || '/api' }}
        run: npm run build

      - name: Copy 404 fallback for SPA deep routing
        run: cp frontend/public/404.html frontend/dist/404.html || true

      - name: Setup Pages
        if: github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main'
        uses: actions/configure-pages@v5

      - name: Upload Artifact
        if: github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'frontend/dist'

      - name: Deploy to GitHub Pages
        if: github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main'
        id: deployment
        uses: actions/deploy-pages@v4
