version: '3.8'

services:
  mysql:
    image: mysql:8.0
    container_name: tournament_mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword123
      MYSQL_DATABASE: gaming_tournament_db
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql
      - ./database/01_schema.sql:/docker-entrypoint-initdb.d/01_schema.sql
      - ./database/02_triggers.sql:/docker-entrypoint-initdb.d/02_triggers.sql
      - ./database/03_seed.sql:/docker-entrypoint-initdb.d/03_seed.sql

  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: tournament_backend
    restart: always
    depends_on:
      - mysql
    environment:
      DB_HOST: mysql
      DB_PORT: 3306
      DB_USER: root
      DB_PASSWORD: rootpassword123
      DB_NAME: gaming_tournament_db
      PORT: 5000
      JWT_SECRET: production_tournament_secret_key_change_me_in_prod
      JWT_EXPIRES_IN: 7d
      CLIENT_URL: http://localhost:80
    ports:
      - "5000:5000"

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: tournament_frontend
    restart: always
    depends_on:
      - backend
    ports:
      - "80:80"

volumes:
  db_data:
